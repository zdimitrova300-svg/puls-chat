<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a14">
  <meta name="description" content="Пулс — модерен чат на живо за двама. Сподели кода на стаята и пишете в реално време.">
  <title>Пулс — чат на живо</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2338bdf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M13 33h9.5l4-11 8 23 5.5-14 2.5 2H51' fill='none' stroke='white' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="orbs" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <section id="joinScreen" class="join-screen">
    <div class="join-card">
      <header class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 12.2h3.4L8.9 6l4 12 2.7-7.2 1.3 1.4H21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Пулс</h1>
          <p>Чат на живо за двама</p>
        </div>
      </header>

      <form id="joinForm" class="join-form" novalidate>
        <div class="field">
          <label for="nameInput">Твоето име</label>
          <input id="nameInput" type="text" maxlength="24" autocomplete="nickname" placeholder="Например: Мария" required>
        </div>

        <div class="field">
          <label for="roomInput">Код на стаята</label>
          <div class="room-field">
            <input id="roomInput" type="text" maxlength="32" autocomplete="off" spellcheck="false" placeholder="luna-482" required>
            <button type="button" id="randomRoom" class="icon-btn" title="Нов случаен код" aria-label="Нов случаен код">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3.5" y="3.5" width="17" height="17" rx="4.5" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/>
                <circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"/>
                <circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"/>
                <circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <p class="hint">Сподели кода с приятел — така сте в една и съща стая.</p>
        </div>

        <p id="joinError" class="form-error" role="alert" hidden></p>

        <button class="primary-btn" type="submit">
          <span>Влез в чата</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>

      <footer class="join-foot">
        <span class="pill"><span class="live-dot"></span>В реално време</span>
        <span class="pill">Без регистрация</span>
      </footer>
    </div>
  </section>

  <section id="chatScreen" class="chat-screen" hidden>
    <div class="chat">
      <header class="chat-header">
        <div class="chat-id">
          <div class="room-avatar" id="roomAvatar">#</div>
          <div class="chat-meta">
            <h2 id="roomTitle">Стая</h2>
            <p class="presence">
              <span class="dot" id="presenceDot"></span>
              <span id="presenceLabel">Свързване…</span>
            </p>
          </div>
        </div>
        <div class="chat-actions">
          <button id="copyRoom" class="icon-btn" title="Копирай поканата" aria-label="Копирай поканата">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2.6" stroke="currentColor" stroke-width="1.8"/>
              <path d="M15 9V6.6A2.6 2.6 0 0 0 12.4 4H6.6A2.6 2.6 0 0 0 4 6.6v5.8A2.6 2.6 0 0 0 6.6 15H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
          <button id="leaveBtn" class="icon-btn danger" title="Излез от чата" aria-label="Излез от чата">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M14 4h3.5A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5H14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M10 8l-4 4 4 4M6 12h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </header>

      <main id="messages" class="messages" aria-label="Съобщения">
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M21 11.6a8.4 8.4 0 0 1-8.6 8.4c-1.2 0-2.4-.2-3.4-.7L4 21l1.6-4.4A8.4 8.4 0 1 1 21 11.6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M8.4 12h.01M12 12h.01M15.6 12h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
          </div>
          <h3>Стаята е тиха засега</h3>
          <p>Изпрати първото съобщение или покани приятел с кода <strong id="emptyRoomCode">стая</strong>.</p>
        </div>
      </main>

      <div id="typingIndicator" class="typing" hidden>
        <span class="typing-dots"><i></i><i></i><i></i></span>
        <span id="typingText">Някой пише…</span>
      </div>

      <footer class="composer">
        <textarea id="messageInput" rows="1" maxlength="2000" placeholder="Напиши съобщение…" aria-label="Съобщение"></textarea>
        <button id="sendBtn" class="send-btn" title="Изпрати" aria-label="Изпрати">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4.2 11.6 20 4.5l-6 15.4-3.2-6.2-6.6-2.1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="m20 4.5-9.2 9.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </footer>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
